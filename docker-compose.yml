services:
  mongodb:
    image: mongo:7-jammy
    container_name: trailguard-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: trailguard
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trailguard-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trailguard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/trailguard
      CLIENT_URLS: http://localhost:${FRONTEND_PORT:-80},http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-insecure-docker-secret-please-change-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-insecure-session-secret-please-change}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - trailguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
        VITE_WS_URL: ws://localhost:${BACKEND_PORT:-3000}
    container_name: trailguard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - trailguard-net

volumes:
  mongo_data:
    driver: local

networks:
  trailguard-net:
    driver: bridge
