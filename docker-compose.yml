services:
  mongodb:
    image: mongo:7-jammy
    container_name: trailguard-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-trailguardsecret}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-trailguard}
    volumes:
      - mongo_data:/data/db
    networks:
      - trailguard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trailguard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-trailguardsecret}@mongodb:27017/${MONGO_DB_NAME:-trailguard}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-trailguard_production_jwt_secret_key_minimum_32_characters}
      SESSION_SECRET: ${SESSION_SECRET:-trailguard_production_session_secret_key_minimum_32_chars}
      ALLOWED_ORIGINS: http://localhost:80,http://localhost:5173,http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - trailguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trailguard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - trailguard-net

networks:
  trailguard-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
