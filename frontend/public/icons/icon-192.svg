<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061B2D"/>
      <stop offset="100%" stop-color="#020C15"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <rect width="190" height="190" x="1" y="1" rx="43" fill="none" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Outer Shield Aura -->
  <path d="M96 32 L144 54 V96 C144 126 123 151 96 160 C69 151 48 126 48 96 V54 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.12" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round"/>
        
  <!-- Inner Shield Core -->
  <path d="M96 46 L132 62 V96 C132 119 116 138 96 146 C76 138 60 119 60 96 V62 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.22"/>

  <!-- Pulse / Vitals Line -->
  <path d="M68 98 H82 L88 84 L96 112 L104 88 L110 98 H124" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Satellite / Beacon Ping -->
  <circle cx="96" cy="46" r="3.5" fill="#34D399"/>
</svg>