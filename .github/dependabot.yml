version: 2

updates:
  # Backend: Group all npm updates into 1 monthly PR
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      backend-dependencies:
        patterns: ["*"]

  # Frontend: Group all npm updates into 1 monthly PR
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      frontend-dependencies:
        patterns: ["*"]

  # Mobile: Group all updates into 1 monthly PR
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      mobile-dependencies:
        patterns: ["*"]

  # Hardware Python: 1 monthly check
  - package-ecosystem: "pip"
    directory: "/hardware"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1

  # GitHub Actions: 1 monthly check
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
