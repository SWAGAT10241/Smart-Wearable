name: 🐛 Bug Report
description: Create a report to help us fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the project is having issues?
      options:
        - Backend API / WebSocket
        - Frontend Web Dashboard
        - Mobile App (React Native / Expo)
        - Hardware Sensors / BLE Firmware
        - CI/CD / Docker Deployment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start backend with 'pnpm run dev'
        2. Send POST request to '/api/...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any stack traces or terminal output here.
      render: shell
