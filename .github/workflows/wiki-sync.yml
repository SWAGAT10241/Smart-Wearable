name: Sync Graphify Wiki to GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'graphify-out/**'
      - '.github/workflows/wiki-sync.yml'

  workflow_dispatch:

concurrency:
  group: wiki-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync Knowledge Graph to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync Knowledge Graph to Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking GitHub Wiki availability for ${{ github.repository }}..."

          # Attempt to clone the wiki repository
          CLONE_OUTPUT=$(git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" .wiki 2>&1 || true)
          if [ ! -d ".wiki" ]; then
            if echo "$CLONE_OUTPUT" | grep -qiE "repository not found|could not read from remote|not found"; then
              echo "::warning title=Wiki Not Initialized::The GitHub Wiki repository (${{ github.repository }}.wiki) does not exist or has not been initialized. Please visit https://github.com/${{ github.repository }}/wiki and click 'Create the first page' to initialize it."
              exit 0
            else
              echo "::error::Failed to clone wiki repository: $CLONE_OUTPUT"
              exit 1
            fi
          fi

          echo "Refreshing graphify wiki export from latest graph..."
          pip install --upgrade pip
          pip install graphifyy
          python -m graphify export wiki

          if [ ! -d "graphify-out/wiki" ]; then
            echo "::error::Failed to locate or generate graphify-out/wiki"
            exit 1
          fi

          echo "Copying wiki pages into .wiki directory..."
          cp -r graphify-out/wiki/* .wiki/

          # GitHub Wiki uses Home.md as the homepage
          if [ -f "graphify-out/wiki/index.md" ]; then
            cp "graphify-out/wiki/index.md" ".wiki/Home.md"
          fi

          # Generate GitHub Wiki Sidebar (_Sidebar.md) using printf to prevent YAML heredoc indentation issues
          printf '# SWAAS Architecture\n- [Home](Home)\n- [Architecture Index](index)\n\n### Key Communities\n' > .wiki/_Sidebar.md

          if [ -f ".wiki/index.md" ]; then
            grep -E '^\- \[Community ' .wiki/index.md | head -n 30 | sed -E 's/\(([^)]+)\.md\)/(\1)/' >> .wiki/_Sidebar.md || true
          fi

          # Convert all relative markdown links (.md) to extensionless wiki links across all pages
          node -e '
            const fs = require("fs");
            const path = require("path");
            const files = fs.readdirSync(".wiki").filter(f => f.endsWith(".md"));
            for (const file of files) {
              const filePath = path.join(".wiki", file);
              let content = fs.readFileSync(filePath, "utf-8");
              const updated = content.replace(/\]\(([A-Za-z0-9_.-]+)\.md\)/g, "]($1)");
              if (updated !== content) {
                fs.writeFileSync(filePath, updated, "utf-8");
              }
            }
          '

          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --staged --quiet; then
            echo "GitHub Wiki is already up to date with the latest knowledge graph."
          else
            git commit -m "docs(wiki): auto-sync knowledge graph from commit ${{ github.sha }}"
            git push origin HEAD
            echo "GitHub Wiki published successfully!"
          fi
