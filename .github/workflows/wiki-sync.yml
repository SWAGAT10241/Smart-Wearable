name: Sync Graphify Wiki to GitHub Wiki

on:
  push:
    branches: [main, SWAAS]
    paths:
      - 'graphify-out/**'
      - '.github/workflows/wiki-sync.yml'

  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-wiki:
    name: Sync Knowledge Graph to GitHub Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Export Knowledge Graph to Wiki
        run: |
          echo "Refreshing graphify wiki export from latest graph..."
          python -m pip install --disable-pip-version-check "graphifyy==0.9.97"
          python -m graphify export wiki

          if [ ! -d "graphify-out/wiki" ]; then
            echo "::error::Failed to locate or generate graphify-out/wiki"
            exit 1
          fi

      - name: Publish to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "Checking GitHub Wiki availability for ${{ github.repository }}..."
          AUTH_TOKEN=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          WIKI_REPO_URL="https://${AUTH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          rm -rf /tmp/wiki-target
          if ! git clone --depth 1 "$WIKI_REPO_URL" /tmp/wiki-target 2>/dev/null; then
            echo "::warning::GitHub Wiki repository is not initialized or inaccessible. Skipping publish."
            exit 0
          fi

          echo "Syncing exported markdown files into wiki..."
          rsync -av --delete --exclude='.git' graphify-out/wiki/ /tmp/wiki-target/

          cd /tmp/wiki-target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "docs(wiki): update knowledge graph documentation from ${SOURCE_SHA:0:7} [skip ci]"
            git push origin HEAD:master
            echo "Knowledge graph wiki successfully synchronized."
          else
            echo "No documentation changes detected; wiki is up to date."
          fi
