name: Smart-Wearable CI

on:
  push:
    branches: [main, SWAAS]
  pull_request:
    branches: [main, SWAAS]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check server syntax
        run: node --check server.js

      - name: Run backend tests
        run: pnpm test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm run test:run

      - name: Build frontend
        run: pnpm run build

  deployment-config:
    name: Deployment Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        env:
          MONGO_ROOT_USER: ci-admin
          MONGO_ROOT_PASSWORD: ci-local-only-password
          MONGO_DB_NAME: trailguard
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          SESSION_SECRET: ci-session-secret-at-least-32-characters
          CLIENT_URLS: http://localhost:80
          VITE_WS_URL: ws://localhost:80/live
        run: docker compose config --quiet

  hardware:
    name: Hardware Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m compileall -q hardware

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1
        with:
          version: v5.3.2

      - name: Build ESP32-S3 firmware
        working-directory: hardware/firmware
        run: |
          idf.py set-target esp32s3
          idf.py build

  mobile:
    name: Mobile App Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js

      - name: Validate Expo project health
        run: npx --yes expo-doctor

      - name: Validate bundle export
        run: npx expo export -p android --no-bytecode
