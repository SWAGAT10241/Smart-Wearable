name: Smart-Wearable CI

on:
  push:
    branches: [main, SWAAS]
  pull_request:
    branches: [main, SWAAS]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check server syntax
        run: node --check server.js

      - name: Run backend tests
        run: pnpm test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm run test:run

      - name: Build frontend
        run: pnpm run build

  hardware:
    name: Hardware Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q hardware

      - name: Install ESP-IDF
        if: hashFiles('hardware/firmware/CMakeLists.txt') != ''
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1
        with:
          version: v5.3.2

      - name: Build ESP32-S3 firmware
        if: hashFiles('hardware/firmware/CMakeLists.txt') != ''
        working-directory: hardware/firmware
        run: |
          idf.py set-target esp32s3
          idf.py build

  mobile:
    name: Mobile App Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js

      - name: Validate Expo project health
        run: npx --yes expo-doctor

      - name: Validate bundle export
        run: npx expo export -p android --no-bytecode

  gateway-go:
    name: Go Ingestion Gateway Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/gateway-go

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f330738e32a69b72852991ab558612a73a3b # v5.3.0
        with:
          go-version-file: services/gateway-go/go.mod
          cache-dependency-path: services/gateway-go/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go vet (Static Analysis)
        run: go vet ./...

      - name: Run Go tests with race detector and coverage
        run: go test -v -race -cover ./...

      - name: Build Go binary
        run: go build -v -o /dev/null ./cmd/server

      - name: Verify Docker build
        run: docker build -t gateway-go:ci .

  crypto-rust:
    name: Rust Crypto Core Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check if Rust workspace exists
        id: check_rust
        run: |
          if [ -f "services/crypto-rust/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "services/crypto-rust/Cargo.toml not found, skipping Rust check."
          fi

      - name: Setup Rust toolchain
        if: steps.check_rust.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check code formatting
        if: steps.check_rust.outputs.exists == 'true'
        working-directory: services/crypto-rust
        run: cargo fmt --check

      - name: Run Clippy linter
        if: steps.check_rust.outputs.exists == 'true'
        working-directory: services/crypto-rust
        run: cargo clippy -- -D warnings

      - name: Run Rust tests
        if: steps.check_rust.outputs.exists == 'true'
        working-directory: services/crypto-rust
        run: cargo test --verbose
